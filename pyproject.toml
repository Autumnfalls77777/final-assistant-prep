[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-backend"
version = "0.1.0"
description = "JARVIS local-first backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "psutil==7.2.2",
    "pydantic-settings==2.14.1",
    "tzdata>=2024.1",
    "uvicorn==0.48.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "mypy>=1.14,<2.0",
    "pytest==9.0.3",
    "ruff>=0.9,<1.0",
    "types-psutil>=7.2,<8.0",
]

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
pythonpath = ["backend/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/src/jarvis"]
mypy_path = "backend/src"
